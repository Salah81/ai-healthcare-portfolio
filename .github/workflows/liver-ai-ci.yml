name: LiverAI CI

on:
  push:
    paths:
      - "04-liver-tumor-deep-learning/**"
      - ".github/workflows/liver-ai-ci.yml"
  pull_request:
    paths:
      - "04-liver-tumor-deep-learning/**"
      - ".github/workflows/liver-ai-ci.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 04-liver-tumor-deep-learning
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Test
        run: pytest -q
